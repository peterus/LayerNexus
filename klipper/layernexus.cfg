# LayerNexus operator dialogs for Klipper (KlipperScreen / Mainsail prompts).
#
# Install: upload this file to ~/printer_data/config/ and add
#     [include layernexus.cfg]
# to printer.cfg, then FIRMWARE_RESTART.
#
# Requirement: printer.cfg must contain a [respond] section. It is NOT
# defined here because a duplicate [respond] section stops Klipper from
# starting.
#
# These macros contain no logic: they close the open prompt and echo a line
# prefixed with "LN" that the LayerNexus worker reads over Moonraker and
# acts on. The LayerNexus "Show operator dialogs on the printer" setting
# must be enabled for the printer.
#
# Do not edit the echoed lines: LayerNexus parses them exactly. When the
# LayerNexus release notes say the macros changed, re-upload this file.

[gcode_macro LN_REVIEW]
description: LayerNexus: report a finished plate as good (RESULT=PASS) or bad (RESULT=FAIL)
gcode:
  {% set entry = params.ENTRY|default(0)|int %}
  {% set result = params.RESULT|default("")|upper %}
  {% if result not in ["PASS", "FAIL"] %}
    {action_raise_error("LN_REVIEW: RESULT must be PASS or FAIL")}
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND PREFIX=LN MSG="REVIEW ENTRY={entry} RESULT={result}"

[gcode_macro LN_NEXT_JOB]
description: LayerNexus: start the given queue entry (if it is still next)
gcode:
  {% set entry = params.ENTRY|default(0)|int %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND PREFIX=LN MSG="NEXT ENTRY={entry}"

[gcode_macro LN_MENU]
description: LayerNexus: show the pending review or the next job
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND PREFIX=LN MSG="MENU"

[gcode_macro LN_CLOSE]
description: LayerNexus: close the dialog
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
