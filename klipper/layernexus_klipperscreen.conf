# LayerNexus menu entry for KlipperScreen.
#
# Install: upload this file to ~/printer_data/config/ and add
#     [include layernexus_klipperscreen.conf]
# to KlipperScreen.conf, then restart KlipperScreen.
#
# The entry runs the LN_MENU macro (from layernexus.cfg), which makes
# LayerNexus show the pending review or the next job on the screen.

[menu __main layernexus]
name: LayerNexus
icon: print
method: printer.gcode.script
params: {"script":"LN_MENU"}
