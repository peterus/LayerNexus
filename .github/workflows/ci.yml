name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Check uv.lock matches pyproject.toml
        # Fails when pyproject.toml was changed without re-running `uv lock`.
        run: uv lock --check

      - name: Install lint tools
        # ruff comes from uv.lock (pinned in the "dev" group), not from here.
        run: uv sync --locked --only-group dev

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      DEBUG: "1"
      DJANGO_SECRET_KEY: ci-test-secret-key-for-running-django-tests-in-github-actions

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        # --locked: install exactly uv.lock, fail if it is out of date.
        run: uv sync --locked

      - name: Check for missing migrations
        run: uv run --no-sync python manage.py makemigrations --check --dry-run --noinput

      - name: Run Django system checks
        run: uv run --no-sync python manage.py check --fail-level WARNING

      - name: Run migrations
        run: uv run --no-sync python manage.py migrate --noinput

      - name: Collect static files
        run: uv run --no-sync python manage.py collectstatic --noinput

      - name: Run tests with coverage
        run: |
          uv run --no-sync coverage run manage.py test core -v 2
          uv run --no-sync coverage report
          uv run --no-sync coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Audit locked dependencies (pip-audit)
        # Audits every package pinned in uv.lock (runtime + all groups), with
        # exact versions and hashes - no resolution, no installs.
        run: |
          set -euo pipefail
          uv export --quiet --locked --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/locked-requirements.txt"
          # Guard against an empty export silently passing the audit.
          COUNT=$(grep -cE '^[A-Za-z0-9._-]+==' "$RUNNER_TEMP/locked-requirements.txt" || true)
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::uv export produced no pinned packages - refusing to report a clean audit."
            exit 1
          fi
          echo "Auditing ${COUNT} locked packages"
          uv run --no-sync pip-audit --strict --disable-pip -r "$RUNNER_TEMP/locked-requirements.txt"

      - name: Django deployment checklist
        run: |
          DJANGO_SECRET_KEY=ci-audit-key-that-is-long-enough-for-django-security-check-validation \
          DEBUG=0 \
          ALLOWED_HOSTS=localhost \
          uv run --no-sync python manage.py check --deploy --fail-level WARNING

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image (release)
        run: docker build --target release -t layernexus:test .

      - name: Run container smoke test
        run: |
          docker run -d --name ln-test \
            -e DJANGO_SECRET_KEY=ci-test-secret-key-for-docker-smoke-test-in-github-actions \
            -e ALLOWED_HOSTS=localhost \
            -p 8000:8000 \
            layernexus:test
          timeout 30 sh -c 'until curl -sf http://localhost:8000/health/; do sleep 1; done'
          docker stop ln-test

  pr-preview:
    name: PR Preview Image
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [lint, test, security, docker]
    concurrency:
      group: pr-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/layernexus
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push PR preview image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview-image
          message: |
            ### Preview image ready

            **By tag:**
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
            ```

            **By digest:**
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
            ```

            <sub>Commit: `${{ github.event.pull_request.head.sha }}`</sub>
