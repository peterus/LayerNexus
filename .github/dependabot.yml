# Dependabot configuration — automated dependency update PRs.
# Covers all three ecosystems this repo ships: Python (pyproject.toml +
# uv.lock), the Docker images (Dockerfile: Python base image and the uv
# image), and the GitHub Actions workflows.
# Every PR runs through the existing CI gates (ruff, lock check, migrations,
# tests, coverage, check --deploy, pip-audit, Docker smoke test) before it can
# merge. The grouped PRs ("python-deps", "actions-all") are auto-merged once
# CI is green by .github/workflows/dependabot-automerge.yml; everything else
# stays manual.
version: 2
updates:
  # --- Python dependencies (pyproject.toml + uv.lock) ---
  #
  # uv.lock pins exact versions, so Dependabot knows each package's current
  # version and can classify updates by semver.
  # Policy:
  #   - Minor + patch updates of every package (direct and transitive) except
  #     django and ruff -> one grouped PR "python-deps", auto-merged after
  #     green CI.
  #   - Django updates, ruff updates (pinned "==" in pyproject.toml: a new
  #     ruff minor can reformat the docs, bump deliberately) and ALL major
  #     updates -> individual PRs, never auto-merged (manual upgrade cycle).
  #   - Cooldown: only propose releases that are at least 3 days old (7 days
  #     for majors), so a broken/yanked release has time to surface first.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      python-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "django"
          - "ruff"
        update-types:
          - "minor"
          - "patch"

  # --- Docker images (Dockerfile) ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # --- GitHub Actions workflow versions ---
  # All action updates, majors included, are grouped and auto-merged after
  # green CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      actions-all:
        patterns:
          - "*"
