[project]
name = "layernexus"
# Keep in sync with the VERSION file (VERSION is what the Docker image is tagged with).
version = "0.1.0"
description = "The control center for your 3D print workflow"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1.2,<7.0",
    "requests>=2.34.2",
    "pillow>=13.0.0",
    "markdown>=3.11.1",
    "bleach>=6.4.0",
    "whitenoise>=6.12.0",
    "websockets>=17.3,<18",
    "djangorestframework>=3.18.3,<4.0",
    "defusedxml>=0.7.1",
    "drf-spectacular>=0.30.0,<1.0",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    # Pinned: ruff 0.16.x reformats Python code blocks embedded in Markdown and
    # breaks `ruff format --check` on the docs. Bump deliberately.
    "ruff==0.17.1",
    "coverage",
    "pip-audit",
]
debug = [
    "debugpy",
    "django-debug-toolbar",
]
docs = [
    "mkdocs-material",
]

[tool.uv]
# Django app, not an installable package: uv only manages the environment.
package = false

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["core/migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "DJ",   # flake8-django
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no print statements)
]
ignore = [
    "S101",   # assert is fine in tests
    "S105",   # hardcoded passwords allowed in tests/settings
    "S106",   # hardcoded passwords allowed in tests/settings
    "DJ001",  # null=True on CharField is intentional in some models
    "UP045",  # Optional[X] vs X | None – keep for 3.9 compat readability
]

[tool.ruff.lint.per-file-ignores]
"core/tests.py" = ["S105", "S106"]
"core/tests/**" = ["S105", "S106"]
"layernexus/settings.py" = ["S105"]
"core/services/orcaslicer.py" = ["SIM105"]  # try/float/except pattern is clearer than suppress
"core/services/*.py" = ["S113"]  # timeout set via kwargs.setdefault, not missing
"core/services/gcode_thumbnail.py" = ["SIM108"]  # if/else is clearer than ternary here

[tool.ruff.lint.isort]
known-first-party = ["core", "layernexus"]

[tool.coverage.run]
source = ["core"]
omit = [
    "core/migrations/*",
    "core/tests/*",
    "core/tests.py",
]

[tool.coverage.report]
fail_under = 55
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
